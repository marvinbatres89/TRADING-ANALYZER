<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trading Analyzer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="contenedor">

    <h1>Trading Analyzer</h1>

    <div class="tarjeta">

      <h2>Análisis del mercado</h2>

      <p>
        <strong>Tendencia:</strong>
        <span id="tendencia">Esperando conexión...</span>
      </p>

      <p>
        <strong>RSI:</strong>
        <span id="rsi">--</span>
      </p>

      <p>
        <strong>Volatilidad:</strong>
        <span id="volatilidad">--</span>
      </p>

      <button id="analizarBtn">
        Analizar mercado
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
